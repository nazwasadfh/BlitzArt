[profile]
name = "blitzart"
version = "1.0.0"
description = "BlitzArt Linux - Artix-based live ISO with blitz installer"
author = "BlitzArt Team"
packager = "BlitzArt"
categories = "artix dinit btrfs grub-btrfs"
homepage = "https://blitzart.example.com/"

[init]
init = "dinit"

[repositories]
# Core Artix repositories
artix = "https://artixlinux.org/repo/artix"
# Arch Linux repositories
arch = "https://geo.mirror.pkgbuild.com/archlinux"
# BlackArch repositories
blackarch = "https://blackarch.org/repos/blackarch"
# Chaotic-AUR repositories
chaotic-aur = "https://chaos-kz.org/mirror/chaotic-aur"

[boot]
# UEFI boot only
efi = true
uefi_partition_type = "esp"
efi_dir = "/boot/efi"

[filesystems]
# Btrfs root filesystem with subvolumes
fstype_root = "btrfs"
fstype_home = "btrfs"
home_subvol = "@home"
root_subvol = "@"
snapshots_subvol = "@snapshots"

[grub]
# GRUB distributor
distributor = "BlitzArt"

[os-release]
name = "BlitzArt"
pretty_name = "BlitzArt Linux"
id = "artix"
id_like = "arch"
version = "2026.11"
version_id = "2026.11"

[packages]
# Packages are loaded from packages.d/blitzart.packages

[build]
# Build settings
compression = "zstd"
compression_level = 19

[customize]
# Customization hooks
post_install_script = "/root/post-install.sh"