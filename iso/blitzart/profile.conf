# BlitzArt Linux - Artix-based live ISO profile for artools buildiso
# This file is SOURCEED by buildiso (must be valid bash)

# --- Profile metadata ---
profile="blitzart"
profile_version="1.0.0"
profile_description="BlitzArt Linux - Artix-based live ISO with blitz installer and dinit init"
profile_author="BlitzArt Team"
profile_packager="BlitzArt"
profile_categories="artix dinit btrfs grub-btrfs"
profile_homepage="https://blitzart.example.com/"

# --- Live session configuration ---
displaymanager="none"
autologin="yes"
hostname="blitzart"
username="blitzart"
password="blitzart"
addgroups="wheel"
services=('NetworkManager')
services_live=('artix-live' 'pacman-init')

# --- Filesystem configuration ---
fstype_root="btrfs"
fstype_home="btrfs"
home_subvol="@home"
root_subvol="@"
snapshots_subvol="@snapshots"

# --- GRUB configuration ---
grub_distributor="BlitzArt"

# --- OS release configuration ---
os_name="BlitzArt"
os_pretty="BlitzArt Linux"
os_id="artix"
os_id_like="arch"
os_version="2026.11"
os_version_id="2026.11"
os_homeurl="https://blitzart.example.com/"
os_supporturl="https://blitzart.example.com/"
os_bugreporturl="https://blitzart.example.com/issues/"
os_logo="blitzart"

return 0
