# BlitzArt Linux profile for artools buildiso
# This is a YAML profile; buildiso may check for profile.yaml alongside profile.conf

profile: blitzart
version: "1.0.0"
description: "BlitzArt Linux - Artix-based live ISO with blitz installer and dinit init"

# Live session configuration
displaymanager: "none"
autologin: "yes"
hostname: "blitzart"
username: "blitzart"
password: "blitzart"
addgroups: "wheel"

# Services
services:
  - NetworkManager
services_live:
  - artix-live
  - pacman-init

# Filesystem configuration
fstype_root: "btrfs"
fstype_home: "btrfs"
home_subvol: "@home"
root_subvol: "@"
snapshots_subvol: "@snapshots"

# GRUB configuration
grub_distributor: "BlitzArt"

# OS release configuration
os_name: "BlitzArt"
os_pretty: "BlitzArt Linux"
os_id: "artix"
os_id_like: "arch"
os_version: "2026.11"
os_version_id: "2026.11"

# Package groups
profile_packages:
  - base
  - base-devel
  - linux
  - linux-firmware
  - intel-ucode
  - amd-ucode
  - dinit
  - dinit-geninitrd
  - dinit-openrc
  - grub
  - grub-btrfs
  - btrfs-progs
  - snapper
  - snapper-tmpfiles
  - networkmanager
  - efibootmgr
  - dosfstools
  - eza
  - ugrep
  - tree
  - fastfetch
  - starship
  - mcfly
  - zoxide
  - fzf
  - bat
  - zsh
  - zsh-syntax-highlighting
  - zsh-autosuggestions
  - zsh-history-substring-search
  - oh-my-zsh
  - git
  - nano
  - vim
  - curl
  - wget